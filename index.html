<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>주아케 SD 놀이방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gowun+Dodum&display=swap">
<style>
/* layout: one full-bleed canvas room; a quiet chip row sits on the floor band below the line */
:root{
  --room:#f3f2ef;
  --floor:#e9e7e2;
  --line:#cdc9c0;
  --ink:#2f2c31;
  --muted:#8b867d;
  --chip:#ffffff;
  --chip-edge:#d8d4cb;
  --red:#b3343c;
  --font-ui:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-say:'Gaegu','Gowun Dodum','Apple SD Gothic Neo',sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--room);color:var(--ink);font-family:var(--font-ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.grabbing{cursor:grabbing}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-block:0 calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;transition:opacity .25s,transform .25s}
.bar button,.corner button{font:inherit;line-height:1;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.bar button:focus-visible,.corner button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dock{position:relative;display:flex;align-items:center;max-width:100%;pointer-events:auto;background:var(--chip);
  border:1.5px solid var(--chip-edge);border-radius:999px;padding:3px;gap:2px;box-shadow:0 2px 10px rgba(47,44,49,.06)}
.tools{display:flex;gap:1px;min-width:0}
.dock button{border:0;background:transparent;border-radius:999px;font-size:14.5px;padding:9px 12px 8px;white-space:nowrap;transition:background .15s,color .15s}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--chip)}
.tools button.hot::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:2px}
.toast{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13.5px;color:var(--chip);background:var(--ink);
  padding:8px 13px 7px;border-radius:999px;pointer-events:none;animation:pop .16s ease-out;transition:opacity .3s}
.toast.out{opacity:0}
.dock .vsep{width:1.5px;align-self:stretch;margin:6px 3px;background:var(--chip-edge);flex:none}
.propbtn{display:inline-flex;align-items:center;gap:5px;position:relative}
.propbtn svg{width:15px;height:15px;transition:transform .2s}
.propbtn[aria-expanded="true"]{background:var(--floor)}
.propbtn[aria-expanded="true"] svg{transform:rotate(45deg)}
.propbtn .count{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.drawer{position:absolute;bottom:calc(100% + 10px);right:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:max-content;max-width:min(92vw,520px);
  background:var(--chip);border:1.5px solid var(--chip-edge);border-radius:18px;padding:8px;box-shadow:0 6px 22px rgba(47,44,49,.10);
  transform-origin:bottom right;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.drawer button{display:inline-flex;align-items:center;gap:7px;font-size:14px;padding:9px 13px 8px;border:1.5px solid var(--chip-edge);background:var(--chip);border-radius:999px}
.drawer button .dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted);box-sizing:border-box}
.drawer button[aria-pressed="true"]{border-color:var(--ink)}
.drawer button[aria-pressed="true"] .dot{background:var(--red);border-color:var(--red)}
.corner{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:5}
.corner button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1.5px solid var(--chip-edge);
  padding:0;transition:opacity .25s,transform .1s}
.corner button:active,.dock button:active,.drawer button:active{transform:scale(.95)}
.corner svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.ui-off .bar,body.ui-off .hint,body.ui-off #b-quake,body.ui-off #b-reset{opacity:0;pointer-events:none!important}
body.ui-off .bar *{pointer-events:none!important}
body.ui-off .bar{transform:translateY(10px)}
body.ui-off #b-hide{opacity:.35}
body.ui-off #b-hide:hover,body.ui-off #b-hide:focus-visible{opacity:1}
#cv.tool-off{cursor:none}
.hint{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:calc(max(12px,env(safe-area-inset-right,0px)) + 140px);
  font-size:14px;color:var(--muted);letter-spacing:.01em;pointer-events:none;transition:opacity .8s;text-wrap:balance}
.hint b{color:var(--ink);font-weight:400}
.hint.gone{opacity:0}
.loading[hidden],[hidden]{display:none!important}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px}
@media (max-width:440px){.dock button{font-size:13px;padding:8px 6.5px 7px}.dock .vsep{margin:6px 1px}.propbtn .lbl{display:none}.propbtn svg{width:17px;height:17px}
  .drawer button{font-size:13.5px;padding:8px 11px 7px}}
@media (max-width:350px){.tools button{padding:8px 5px 7px;font-size:12.5px}}
</style>
</head>
<body>
<canvas id="cv" aria-label="조커와 아케치가 노는 공간. 캐릭터를 눌러 집고, 흔들고, 던질 수 있어요."></canvas>
<div class="hint" id="hint"><b>머리를 꾹 잡아서</b> 들어 올려 보세요 · 톡 누르면 콕 찔러요 · 아래 도구로 놀려 보세요</div>
<div class="loading" id="loading">불러오는 중…</div>
<div class="corner" id="corner">
  <button id="b-quake" type="button" aria-label="바닥 흔들기" title="바닥 흔들기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15l3-4 3 5 3-7 3 8 3-6 3 4"/><path d="M4 20h16"/></svg></button>
  <button id="b-reset" type="button" aria-label="처음 장면" title="처음 장면"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg></button>
  <button id="b-hide" type="button" aria-label="UI 숨기기" aria-pressed="false" title="UI 숨기기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16" style="display:none"/></svg></button>
</div>
<nav class="bar" id="bar" aria-label="도구와 소품">
  <div class="dock">
    <div class="tools" role="group" aria-label="도구">
      <button type="button" data-tool="hand" aria-pressed="true">손</button>
      <button type="button" data-tool="spray" aria-pressed="false">분무기</button>
      <button type="button" data-tool="feather" aria-pressed="false">깃털</button>
      <button type="button" data-tool="wind" aria-pressed="false">바람</button>
      <button type="button" data-tool="tilt" aria-pressed="false">기울이기</button>
      <button type="button" data-tool="lure" aria-pressed="false">장난감</button>
      <button type="button" data-tool="snack" aria-pressed="false">간식</button>
    </div>
    <span class="vsep" aria-hidden="true"></span>
    <button id="b-props" class="propbtn" type="button" aria-expanded="false" aria-controls="drawer" aria-label="소품 꺼내기"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">소품</span><span class="count" id="pcount" hidden></span></button>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="drawer" id="drawer" role="group" aria-label="소품" hidden>
      <button id="b-cup" type="button" aria-pressed="false"><span class="dot"></span>커피잔</button>
      <button id="b-box" type="button" aria-pressed="false"><span class="dot"></span>상자</button>
      <button id="b-cushion" type="button" aria-pressed="false"><span class="dot"></span>쿠션</button>
      <button id="b-banana" type="button" aria-pressed="false"><span class="dot"></span>바나나 껍질</button>
      <button id="b-glass" type="button" aria-pressed="false"><span class="dot"></span>투명 컵</button>
    </div>
  </div>
</nav>

/* ---------- they get back at you: run over and grab the cursor ---------- */

function counterStep(side){
  return {enter(c){c.cs={tries:0,cd:T+0.8}},tick(c,t,dt){

    if(t<0.8){c.q.lean+=sgn(ptr.x-c.x)*0.05;c.walking=0;return false}

/* ---------- wind ---------- */

/* ---------- tilting the floor ---------- */

    if(free&&c.tag!=='tilt'){cancel(c);c.tag='tilt';c.slipping=0;c.slideV=0}
    if(c.tag==='tilt'){
      if(Math.abs(A)<0.16&&!c.slipping){c.walkInPlace=1;c.wdir=-down;c.t.face=-down;c.exprB='squint';c.mouthB='wavy';c.slideV=(c.slideV||0)*0.85;c.x+=down*14*K*dt*Math.abs(A)/0.16}

    c.slideV*=1-0.5*dt;c.x+=c.slideV*dt;

}

/* ---------- the glass ---------- */

    if(c.trapped)c.x=clamp(c.x,g.x-lim,g.x+lim);

function trapStep(){
  return {enter(c){c.tp={next:T+1.2,mode:'look',tx:c.x,esc:0}},tick(c,t,dt){
    const g=c.trapped;if(!g||!props.includes(g)){c.walking=0;c.t.armL=c.t.armR=0;c.t.sit=0;c.exprB='normal';c.trapped=null;return true}

    else if(p.kind==='steam'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*14*K}
    else if(p.kind==='mist'){p.vx*=1-1.6*dt;p.vy=p.vy*(1-1.6*dt)+30*K*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
    if(p.life<=0)parts.splice(i,1);}
}
function drawParts(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const p of parts){const a=clamp(p.life/p.max,0,1);
    if(p.kind==='steam'){ctx.fillStyle=`rgba(255,255,255,${0.7*a})`;ctx.strokeStyle=`rgba(190,185,180,${0.5*a})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();ctx.stroke()}
    else if(p.kind==='wind'){ctx.strokeStyle=`rgba(140,150,160,${0.35*Math.sin(a*Math.PI)})`;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(p.x-sgn(p.vx)*p.r*0.5,p.y-4,p.x-sgn(p.vx)*p.r,p.y+1);ctx.stroke()}
    else if(p.kind==='mist'){ctx.fillStyle=`rgba(175,212,230,${0.55*a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1.6-a*0.6),0,TAU);ctx.fill()}
    else if(p.kind==='drop'){ctx.fillStyle=`rgba(120,182,214,${0.85*Math.min(1,a*2)})`;ctx.beginPath();ctx.moveTo(p.x,p.y-p.r*2);ctx.quadraticCurveTo(p.x+p.r,p.y,p.x,p.y+p.r);ctx.quadraticCurveTo(p.x-p.r,p.y,p.x,p.y-p.r*2);ctx.fill()}
    else{ctx.fillStyle=`rgba(120,182,214,${0.5*a})`;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*2.2*(1.4-a*0.4),p.r*0.6,0,0,TAU);ctx.fill()}}
}
function drawBanana(b){
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.ang);const w=b.w,h=b.h;
  ctx.fillStyle='rgba(60,50,30,0.12)';ctx.beginPath();ctx.ellipse(0,1,w*0.5,h*0.16,0,0,TAU);ctx.fill();
  const flap=(sx,ex,ey,c1)=>{ctx.fillStyle=c1;ctx.beginPath();ctx.moveTo(sx*w*0.08,-h*0.3);ctx.quadraticCurveTo(ex*w*0.3,-h*0.95,ex*w*0.52,ey);ctx.quadraticCurveTo(ex*w*0.3,-h*0.15,sx*w*0.06,-h*0.05);ctx.closePath();ctx.fill()};
  flap(-1,-1,-h*0.12,'#e5bd3a');flap(1,1,-h*0.18,'#efca47');
  ctx.fillStyle='#f6dc6c';ctx.beginPath();ctx.moveTo(-w*0.06,-h*0.25);ctx.quadraticCurveTo(-w*0.02,-h*1.25,w*0.2,-h*0.95);ctx.quadraticCurveTo(w*0.04,-h*0.6,w*0.07,-h*0.1);ctx.closePath();ctx.fill();
  ctx.fillStyle='#d9ae2c';ctx.beginPath();ctx.ellipse(0,-h*0.2,w*0.13,h*0.28,0,0,TAU);ctx.fill();
  ctx.fillStyle='#6b4a2a';ctx.beginPath();ctx.ellipse(-w*0.52,-h*0.12,w*0.03,h*0.08,0,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(w*0.52,-h*0.18,w*0.03,h*0.08,0,0,TAU);ctx.fill();
  ctx.fillStyle='#7b5a33';ctx.fillRect(-w*0.035,-h*0.12,w*0.07,h*0.2);
  ctx.restore();
}
function drawTool(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const k=clamp(K,0.7,1.3)*1.35;
  if(tool==='tilt'&&ptr.active){
    ctx.save();ctx.translate(ptr.x,ptr.y);ctx.fillStyle='rgba(47,44,49,0.82)';ctx.beginPath();ctx.arc(0,0,13*k,0,TAU);ctx.fill();
    ctx.strokeStyle='#ffffff';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-5*k,-3*k);ctx.lineTo(0,-8*k);ctx.lineTo(5*k,-3*k);ctx.moveTo(-5*k,3*k);ctx.lineTo(0,8*k);ctx.lineTo(5*k,3*k);ctx.stroke();ctx.restore();return;
  }
  if(tool==='wind'&&ptr.active){
    ctx.save();ctx.translate(ptr.x,ptr.y);ctx.fillStyle='#d6d2ca';ctx.fillRect(-2*k,8*k,4*k,26*k);
    ctx.fillStyle='#f6f3ee';ctx.strokeStyle='#8b867d';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,16*k,0,TAU);ctx.fill();ctx.stroke();
    ctx.rotate(T*(blowing?28:1.5));ctx.fillStyle='#9fc3d3';for(let i=0;i<3;i++){ctx.rotate(TAU/3);ctx.beginPath();ctx.ellipse(0,-8*k,4.5*k,8*k,0,0,TAU);ctx.fill()}
    ctx.fillStyle='#5f7f8f';ctx.beginPath();ctx.arc(0,0,3*k,0,TAU);ctx.fill();ctx.restore();return;
  }
  if(lureOn()){
    const x=lure.x,y=lure.y;
    if(tool==='snack'){
      ctx.strokeStyle='#8b867d';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(lure.tx,-4);ctx.quadraticCurveTo((lure.tx+x)/2,y*0.55,x,y-16*k);ctx.stroke();
      if(T>=lure.respawnT){const pop=clamp((T-lure.respawnT)/0.25,0,1);drawCookie(x,y,20*k*(0.4+0.6*pop),0)}
      return;
    }
    ctx.strokeStyle='#8b867d';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(lure.tx,-4);ctx.quadraticCurveTo((lure.tx+x)/2,y*0.55,x,y-14*k);ctx.stroke();
    ctx.save();ctx.translate(x,y);ctx.rotate(clamp(lure.vx*0.0012,-0.9,0.9)+Math.sin(T*3)*0.08);
    ctx.fillStyle='#e7a24a';ctx.beginPath();ctx.ellipse(0,0,13*k,24*k,0,0,TAU);ctx.fill();
    ctx.fillStyle='#d58a35';ctx.beginPath();ctx.moveTo(0,20*k);ctx.lineTo(-13*k,38*k);ctx.lineTo(13*k,38*k);ctx.closePath();ctx.fill();
    ctx.fillStyle='#f3c27a';ctx.fillRect(-12*k,-2*k,24*k,6*k);
    ctx.fillStyle='#2f2c31';ctx.beginPath();ctx.arc(-5*k,-12*k,2.6*k,0,TAU);ctx.arc(5*k,-12*k,2.6*k,0,TAU);ctx.fill();
    ctx.restore();return;
  }
  if(!ptr.active)return;
  const x=ptr.x,y=ptr.y;
  if(tool==='spray'){
    ctx.save();ctx.translate(x,y);
    ctx.fillStyle='#4f7486';ctx.fillRect(-14*k,-8*k,30*k,12*k);
    ctx.fillStyle='#3c5c6d';ctx.fillRect(-20*k,-6*k,8*k,6*k);
    ctx.fillStyle='#4f7486';ctx.beginPath();ctx.moveTo(10*k,4*k);ctx.lineTo(4*k,18*k);ctx.lineTo(9*k,20*k);ctx.lineTo(16*k,6*k);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(196,224,236,0.92)';rr(4*k,4*k,30*k,52*k,9*k);ctx.fill();
    ctx.fillStyle='rgba(130,186,212,0.75)';rr(6*k,24*k,26*k,30*k,7*k);ctx.fill();
    ctx.restore();
  }else if(tool==='feather'){
    ctx.save();ctx.translate(x,y);ctx.rotate(-0.7+Math.sin(T*(ptr.sp>70?22:3))*0.18);
    ctx.fillStyle='#f6f1e8';ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-16*k,-34*k,0,-72*k);ctx.quadraticCurveTo(16*k,-34*k,0,0);ctx.fill();
    ctx.fillStyle='#e9b9b2';ctx.beginPath();ctx.moveTo(0,-46*k);ctx.quadraticCurveTo(-9*k,-60*k,0,-72*k);ctx.quadraticCurveTo(9*k,-60*k,0,-46*k);ctx.fill();
    ctx.strokeStyle='#cfc6b8';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(0,6*k);ctx.lineTo(0,-66*k);ctx.stroke();
    ctx.strokeStyle='#e4ddd1';ctx.lineWidth=1.2;for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(0,-i*13*k);ctx.lineTo(-9*k,-i*13*k+6*k);ctx.moveTo(0,-i*13*k-4*k);ctx.lineTo(9*k,-i*13*k+3*k);ctx.stroke()}
    ctx.restore();
  }
}

/* ---------- UI ---------- */
const hintEl=document.getElementById('hint');let hintGone=false;
function hideHint(){if(!hintGone){hintGone=true;setTimeout(()=>hintEl.classList.add('gone'),1200)}}
function updatePropCount(){const n=props.length,el=document.getElementById('pcount');el.hidden=n===0}
function setupButtons(){
  for(const b of document.querySelectorAll('[data-tool]'))b.addEventListener('click',()=>setTool(b.dataset.tool));
  document.getElementById('b-quake').addEventListener('click',quake);
  for(const type of ['cup','box','cushion','banana','glass']){
    const b=document.getElementById('b-'+type);
    b.addEventListener('click',()=>{const ex=propOf(type);if(ex){removeProp(ex);b.setAttribute('aria-pressed','false')}else{mkProp(type);b.setAttribute('aria-pressed','true')}updatePropCount()});
  }
  const pb=document.getElementById('b-props'),dr=document.getElementById('drawer');
  const setDrawer=open=>{dr.hidden=!open;pb.setAttribute('aria-expanded',open?'true':'false')};
  pb.addEventListener('click',e=>{e.stopPropagation();setDrawer(dr.hidden)});
  cvs.addEventListener('pointerdown',()=>setDrawer(false),true);
  addEventListener('keydown',e=>{if(e.key==='Escape')setDrawer(false)});
  document.getElementById('b-hide').addEventListener('click',e=>{
    const off=!document.body.classList.contains('ui-off');document.body.classList.toggle('ui-off',off);setDrawer(false);
    const b=e.currentTarget;b.setAttribute('aria-pressed',off?'true':'false');b.setAttribute('aria-label',off?'UI 보이기':'UI 숨기기');b.title=off?'UI 보이기':'UI 숨기기';
    b.querySelector('.slash').style.display=off?'':'none';hideHint();
  });
  document.getElementById('b-reset').addEventListener('click',()=>{
    if(drag){drag=null}
    for(const c of CH){detach(c);cancel(c);c.mode='ground';c.dizzy=0;c.meter=0;c.turn=0;c.gyOff=0;c.p.fall=0;c.p.lean=0;c.p.sit=0;c.thrown=0;c.bub=null;c.nextThink=T+2.4+rnd(0,1)}
    tilt.a=tilt.va=tilt.target=0;tilt.drag=null;lure.holder=null;grudge=0;
    for(const c of CH){c.hang=null;c.chainChild=null;c.holdWith=null;c.trapped=null;c.windRoll=0;c.snack=0;c.eating=0;c.spicy=null;c.spicyRoll=0;c.tailGrab=null}
    placeStart();pendingReunion=null;nextIx=T+7;parts.length=0;for(const c of CH){c.wet=0;c.tickle=0;c.annoy=0}
  });
}
function placeStart(){
  const gap=Math.min(0.98*CW(),W*0.46);
  J.x=W/2-gap/2;AK.x=W/2+gap/2;J.t.face=J.p.face=1;AK.t.face=AK.p.face=1;
}

/* ---------- loop ---------- */
function resize(){
  const oW=W;W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);
  cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);
  const barH=document.getElementById('bar').getBoundingClientRect().height||90;
  const floorPad=Math.max(barH+30,H*0.14);GY=H-floorPad;
  S=clamp(Math.min((GY-70)*0.72/820,W*0.5/600),0.18,0.62);K=S/0.45;
  if(oW&&CH){for(const c of CH){c.x=c.x/oW*W;c.ax=c.ax/oW*W}for(const p of props)p.x=p.x/oW*W}
}
let last=0;
function frame(ts){
  const dt=Math.min(0.033,last?(ts-last)/1000:0.016);last=ts;T+=dt;
  if(pend&&performance.now()-pend.t0>200)startPend(ptr.x,ptr.y);
  updateTilt(dt);updateProps(dt);updateLure(dt);updateSpray(dt);updateWind(dt);updateParts(dt);updateQuake();
  grudge=Math.max(0,grudge-dt*0.05);if(counterReady())startCounter();
  for(const c of CH)update(c,dt);
  // after a pick-up: once both are free again, look at each other and sit side by side
  if(pendingReunion){const r=pendingReunion;
    if(T>r.until)pendingReunion=null;
    else if(r.a.mode==='ground'&&r.b.mode==='ground'&&freeFor(r.a,true)&&freeFor(r.b,true)&&(!r.a.script.length||r.a.tag==='idle')&&(!r.b.script.length||r.b.tag==='idle'||r.b.tag==='watch')){
      pendingReunion=null;reunion(r.a,r.b);}}
  draw();
  requestAnimationFrame(frame);
}
async function boot(){
  try{await document.fonts.load('700 24px Gaegu')}catch(e){}
  await loadAll();
  J=mkChar('joker');AK=mkChar('akechi');J.im=IMG.joker;AK.im=IMG.akechi;J.zOrder=1;AK.zOrder=0;CH=[J,AK];
  resize();placeStart();setupButtons();
  addEventListener('resize',resize);
  document.getElementById('loading').hidden=true;
  requestAnimationFrame(frame);
}
boot();
})();
</script>
